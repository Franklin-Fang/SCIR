# # OpenAI API 配置
api:
  base_url: "https://api.openai.com/v1"
  api_key: "your-api-key-here"
  model: "gpt-4o"
  temperature: 0.0
  max_tokens: 10240
  # 请求间隔（秒），防止API限流
  request_delay: 1.0
  # 最大重试次数
  max_retries: 3
  # 重试间隔（秒）
  retry_delay: 5.0

# 输出配置
output:
  # 缺失项输出文件名
  missing_file: "missing.jsonl"
  # 冗余项输出文件名
  redundancy_file: "redundancy.jsonl"
  # 正确项输出文件名
  correct_file: "correct.jsonl"
